<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('剂量预警登记')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">预警单号</label>
                <div class="layui-input-block">
                    <input type="text" name="billNo" autocomplete="off" placeholder="手工录入，如 YJ20260918001"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">所属场所</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-verify="required">
                        <option value="">请选择场所（仅列在用场所）</option>
                        <option th:each="s : ${sites}" th:value="${s.id}"
                                th:text="${s.siteName} + '（' + ${s.siteNo} + '）'"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">剂量率</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0" name="qty" autocomplete="off"
                           placeholder="单位 μSv/h" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">μSv/h</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">预警档位</label>
                <div class="layui-input-block" style="padding-top:9px;">
                    <span class="layui-word-aux">系统按当前生效的剂量率判定规则自动折算，无需填写</span>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">处理状态</label>
                <div class="layui-input-block" style="padding-top:9px;">
                    <span class="layui-word-aux">登记后由系统置为「待处理」</span>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit
                    lay-filter="bill-save">
                <i class="layui-icon layui-icon-ok"></i>
                登记
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/RadAlarmBillController";

        form.on('submit(bill-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/add',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("bill-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2500});
                    }
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
